<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>無限横スクロール・ジャンプゲーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;          /* 画面の縦スクロールを防ぐ */
      background: #87ceeb;       /* 空の色 */
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;        /* スクロールジェスチャをキャンセル */
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================
    // 基本設定・グローバル変数
    // ==========================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let player;
    let walls = [];       // 壁（足場扱い、ダメージなし）
    let platforms = [];   // 空中床
    let items = [];       // 通常アイテム＋モード切替アイテム
    let birds = [];       // 空の敵
    let turtles = [];     // 地上の敵（亀）
    let mushrooms = [];   // 地上の敵（キノコ）
    let holes = [];       // 穴
    let floatTexts = [];  // アイテム取得時のフローティングテキスト

    let score = 0;
    let gameOver = false;
    let isTouching = false;
    let prevIsTouching = false;

    let lastTime = 0;

    const BASE_SCROLL_SPEED = 240;  // 基本スクロール速度（px/sec）
    const GRAVITY = 900;            // 重力加速度（px/sec^2）
    const GROUND_RATIO = 0.8;       // 地面の高さ（画面高さに対する比率）
    const TOP_LIMIT = 20;           // 上方向の制限位置

    let spawnTimer = 0;
    let nextSpawnTime = 1.0;        // 次にオブジェクトを生成するまでの時間（秒）

    // --- モード管理 ---
    let isChickMode = false;
    let chickTimer = 0;
    const CHICK_MODE_DURATION = 4.0;             // ひよこモード継続時間（秒）

    let isBikeMode = false;
    let bikeTimer = 0;
    const BIKE_MODE_DURATION = CHICK_MODE_DURATION * 3; // 自転車モードは3倍

    // --- ライフ管理 ---
    let lives = 3;
    let invincibleTimer = 0;
    const INVINCIBLE_TIME = 0.8;   // ダメージ後の無敵時間（秒）

    // --- ジャンプ管理（2段ジャンプまで） ---
    let jumpUsesLeft = 2;          // 残りジャンプホールド回数（最大2）
    let isCurrentlyThrusting = false;  // 今のホールドで上昇中かどうか

    // --- スワイプ判定 ---
    let touchStartY = null;

    // --- サウンド（Web Audio） ---
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
        }
      }
    }

    function resumeAudio() {
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function playBeep(frequency, duration, type = "sine") {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = frequency;
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.start(now);
      osc.stop(now + duration + 0.05);
    }

    function playItemSound() {
      playBeep(880, 0.15);
    }

    function playChickSound() {
      playBeep(660, 0.10);
      setTimeout(() => playBeep(990, 0.12), 120);
    }

    function playBikeSound() {
      playBeep(440, 0.10);
      setTimeout(() => playBeep(660, 0.12), 120);
    }

    function playHitSound() {
      playBeep(220, 0.40, "square");
    }

    // ==========================
    // 画面サイズ・地面の高さ
    // ==========================
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function getGroundY() {
      return canvas.height * GROUND_RATIO;
    }

    // ==========================
    // ゲーム初期化・リスタート
    // ==========================
    function resetGame() {
      const groundY = getGroundY();

      // プレイヤーの初期位置（画面左側）
      player = {
        x: canvas.width * 0.15,
        y: groundY - 40,
        width: 40,
        height: 40,
        vy: 0,
        emoji: "🏃‍♂️",    // 走っている人（常に前転）
        angle: 0,
        onGround: true
      };

      walls = [];
      platforms = [];
      items = [];
      birds = [];
      turtles = [];
      mushrooms = [];
      holes = [];
      floatTexts = [];

      score = 0;
      gameOver = false;
      spawnTimer = 0;
      nextSpawnTime = randomRange(0.8, 1.6);

      isChickMode = false;
      chickTimer = 0;
      isBikeMode = false;
      bikeTimer = 0;

      lives = 3;
      invincibleTimer = 0;

      jumpUsesLeft = 2;
      isCurrentlyThrusting = false;
      prevIsTouching = false;
    }

    // ==========================
    // ユーティリティ関数
    // ==========================
    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function isPlayerOverHole(p) {
      const pxCenter = p.x + p.width / 2;
      for (const hole of holes) {
        if (pxCenter > hole.x && pxCenter < hole.x + hole.width) {
          return true;
        }
      }
      return false;
    }

    // ==========================
    // モード切り替え
    // ==========================
    function activateChickMode() {
      isChickMode = true;
      chickTimer = CHICK_MODE_DURATION;
      if (isBikeMode) {
        isBikeMode = false;
        bikeTimer = 0;
      }
      player.emoji = "🐥";
      playChickSound();
    }

    function activateBikeMode() {
      isBikeMode = true;
      bikeTimer = BIKE_MODE_DURATION;
      if (isChickMode) {
        isChickMode = false;
        chickTimer = 0;
      }
      player.emoji = "🚴";
      playBikeSound();
    }

    function updateModeTimers(dt) {
      if (isChickMode) {
        chickTimer -= dt;
        if (chickTimer <= 0) {
          isChickMode = false;
          chickTimer = 0;
          if (!isBikeMode) {
            player.emoji = "🏃‍♂️";
          }
        }
      }

      if (isBikeMode) {
        bikeTimer -= dt;
        if (bikeTimer <= 0) {
          isBikeMode = false;
          bikeTimer = 0;
          if (!isChickMode) {
            player.emoji = "🏃‍♂️";
          }
        }
      }
    }

    function getCurrentScrollSpeed() {
      let speed = BASE_SCROLL_SPEED;
      if (isChickMode) {
        speed = BASE_SCROLL_SPEED * 0.6;   // ひよこモード中はゆっくり
      }
      if (isBikeMode) {
        speed = BASE_SCROLL_SPEED * 1.3;   // 自転車モード中は速く
      }
      return speed;
    }

    // ==========================
    // ダメージ処理（ライフ減少）
    // ==========================
    function damagePlayer() {
      if (invincibleTimer > 0 || gameOver) return;
      lives--;
      playHitSound();
      invincibleTimer = INVINCIBLE_TIME;

      if (lives <= 0) {
        gameOver = true;
      }
    }

    // ==========================
    // オブジェクト生成
    //  - 壁は足場（ダメージなし）
    //  - 亀🐢 / キノコ🍄 / 鳥🐦 は敵（ダメージあり）
    // ==========================
    function spawnObject() {
      const groundY = getGroundY();
      const x = canvas.width + 40;
      const r = Math.random();

      if (r < 0.2) {
        // 通常アイテム
        const foodEmojis = ["🍎", "🍌", "🍕", "🍩", "🍔", "🍇"];
        items.push({
          type: "score",
          x,
          y: randomRange(groundY * 0.3, groundY - 120),
          width: 28,
          height: 28,
          emoji: foodEmojis[Math.floor(Math.random() * foodEmojis.length)]
        });
      } else if (r < 0.28) {
        // ひよこモードアイテム
        items.push({
          type: "chick",
          x,
          y: randomRange(groundY * 0.3, groundY - 140),
          width: 30,
          height: 30,
          emoji: "🐣"
        });
      } else if (r < 0.36) {
        // 自転車モードアイテム
        items.push({
          type: "bike",
          x,
          y: randomRange(groundY * 0.3, groundY - 140),
          width: 34,
          height: 34,
          emoji: "🚲"
        });
      } else if (r < 0.50) {
        // 通常の壁（高さも多少バラつき）
        const wallHeight = randomRange(50, 140);
        walls.push({
          x,
          y: groundY - wallHeight,
          width: 40,
          height: wallHeight
        });
      } else if (r < 0.60) {
        // 階段状の壁（2〜3段）
        const stepCount = Math.random() < 0.5 ? 2 : 3;
        const stepWidth = 40;
        const stepHeight = 35;
        for (let i = 0; i < stepCount; i++) {
          const h = stepHeight * (i + 1);
          walls.push({
            x: x + i * stepWidth,
            y: groundY - h,
            width: stepWidth,
            height: h
          });
        }
      } else if (r < 0.70) {
        // 亀（地上の敵）
        const h = 32;
        turtles.push({
          x,
          y: groundY - h,
          width: 40,
          height: h,
          emoji: "🐢"
        });
      } else if (r < 0.80) {
        // キノコ（地上の敵）
        const h = 32;
        mushrooms.push({
          x,
          y: groundY - h,
          width: 32,
          height: h,
          emoji: "🍄"
        });
      } else if (r < 0.95) {
        // 鳥（空の敵）出現率アップ
        const h = 32;
        birds.push({
          x,
          y: randomRange(80, groundY - 130),
          width: 40,
          height: h,
          emoji: "🐦"
        });
      } else {
        // 空中床（プラットフォーム）
        const platWidth = randomRange(100, 160);
        const platY = randomRange(groundY * 0.4, groundY * 0.7);
        platforms.push({
          x,
          y: platY,
          width: platWidth,
          height: 20
        });
      }
    }

    // ==========================
    // 入力処理（タップ・スワイプ）
    // ==========================
    function handleTouchStart(e) {
      e.preventDefault();

      if (!audioCtx) {
        initAudio();
      } else {
        resumeAudio();
      }

      if (gameOver) {
        resetGame();
      }
      isTouching = true;

      const t = e.touches[0];
      touchStartY = t.clientY;
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
      touchStartY = null;
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (e.touches.length === 0) return;
      const t = e.touches[0];
      if (touchStartY === null) touchStartY = t.clientY;
      const dy = t.clientY - touchStartY;

      // 下方向に一定以上スワイプ → 高速落下
      if (dy > 40 && !player.onGround && !gameOver) {
        isTouching = false;
        isCurrentlyThrusting = false;
        jumpUsesLeft = 0;        // これ以上ジャンプ不可
        if (player.vy < 900) {
          player.vy = 900;       // 落下速度アップ
        }
      }
    }

    function setupInput() {
      canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
      canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
      canvas.addEventListener("touchmove", handleTouchMove, { passive: false });

      document.addEventListener("touchmove", function (e) {
        e.preventDefault();
      }, { passive: false });

      // PCテスト用マウス操作
      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        if (!audioCtx) {
          initAudio();
        } else {
          resumeAudio();
        }
        if (gameOver) {
          resetGame();
        }
        isTouching = true;
      });
      canvas.addEventListener("mouseup", (e) => {
        e.preventDefault();
        isTouching = false;
      });
      canvas.addEventListener("mouseleave", () => {
        isTouching = false;
      });
    }

    // ==========================
    // ゲーム更新処理
    // ==========================
    function update(dt) {
      if (gameOver) return;

      const groundY = getGroundY();

      // 無敵時間
      if (invincibleTimer > 0) {
        invincibleTimer -= dt;
        if (invincibleTimer < 0) invincibleTimer = 0;
      }

      // モードタイマー更新
      updateModeTimers(dt);

      const scrollSpeed = getCurrentScrollSpeed();
      const scroll = scrollSpeed * dt;

      // --- タップ開始/終了の判定（2段ジャンプ管理） ---
      if (!isTouching && prevIsTouching) {
        // タップを離した瞬間 → そのホールド分のジャンプ消費
        if (isCurrentlyThrusting) {
          jumpUsesLeft = Math.max(0, jumpUsesLeft - 1);
          isCurrentlyThrusting = false;
        }
      }

      if (isTouching && !gameOver) {
        if (!isCurrentlyThrusting && jumpUsesLeft > 0) {
          isCurrentlyThrusting = true;
        }
      }

      if (isCurrentlyThrusting) {
        player.vy = -300;
      } else {
        player.vy += GRAVITY * dt;
      }

      const prevY = player.y;
      player.y += player.vy * dt;

      // 上限（押しっぱなしで上に張り付かないように）
      if (player.y < TOP_LIMIT) {
        player.y = TOP_LIMIT;
        if (player.vy < 0) player.vy = 0;
        if (isCurrentlyThrusting) {
          isCurrentlyThrusting = false;
          jumpUsesLeft = Math.max(0, jumpUsesLeft - 1);
        }
      }

      let playerBottom = player.y + player.height;
      let playerTop = player.y;

      // --- 壁＋空中床をまとめて「足場」として扱う ---
      const solids = platforms.concat(walls);
      let onPlatform = false;

      for (const solid of solids) {
        const overlapX =
          player.x + player.width > solid.x &&
          player.x < solid.x + solid.width;
        if (!overlapX) continue;

        // 上から着地
        if (
          player.vy >= 0 &&
          playerBottom >= solid.y &&
          playerBottom <= solid.y + solid.height
        ) {
          player.y = solid.y - player.height;
          player.vy = 0;
          playerBottom = player.y + player.height;
          playerTop = player.y;
          onPlatform = true;
          break;
        }

        // 下からぶつかる → 上には抜けられない
        if (
          player.vy < 0 &&
          playerTop <= solid.y + solid.height &&
          prevY >= solid.y + solid.height
        ) {
          player.y = solid.y + solid.height;
          player.vy = 0;
          playerTop = player.y;
          playerBottom = player.y + player.height;
          break;
        }
      }

      // --- 地面・穴処理 ---
      let onGroundNow = false;
      if (!onPlatform && player.vy >= 0 && playerBottom >= groundY) {
        if (isPlayerOverHole(player) && invincibleTimer <= 0) {
          damagePlayer();
        }
        player.y = groundY - player.height;
        player.vy = 0;
        playerBottom = player.y + player.height;
        playerTop = player.y;
        onGroundNow = true;
      }

      player.onGround = onGroundNow || onPlatform;

      // 画面下まで落ちたとき
      if (player.y > canvas.height && invincibleTimer <= 0) {
        damagePlayer();
        player.y = groundY - player.height;
        player.vy = 0;
        playerBottom = player.y + player.height;
        playerTop = player.y;
        player.onGround = true;
      }

      // 足場に立っているときはジャンプ回数リセット
      if (player.onGround && player.vy === 0) {
        jumpUsesLeft = 2;
        if (!isTouching) {
          isCurrentlyThrusting = false;
        }
      }

      // --- 背景オブジェクトの移動 ---
      function moveAndFilter(list) {
        return list
          .map(obj => {
            obj.x -= scroll;
            return obj;
          })
          .filter(obj => obj.x + (obj.width || 0) > -50);
      }

      walls = moveAndFilter(walls);
      platforms = moveAndFilter(platforms);
      items = moveAndFilter(items);
      birds = moveAndFilter(birds);
      turtles = moveAndFilter(turtles);
      mushrooms = moveAndFilter(mushrooms);

      holes = holes
        .map(hole => {
          hole.x -= scroll;
          return hole;
        })
        .filter(hole => hole.x + hole.width > -50);

      // --- 当たり判定 ---
      const playerRect = {
        x: player.x,
        y: player.y,
        width: player.width,
        height: player.height
      };

      // 亀・キノコ（地上の敵）
      for (const t of turtles) {
        if (rectsOverlap(playerRect, t)) {
          if (invincibleTimer <= 0) {
            damagePlayer();
          }
          break;
        }
      }
      if (!gameOver) {
        for (const m of mushrooms) {
          if (rectsOverlap(playerRect, m)) {
            if (invincibleTimer <= 0) {
              damagePlayer();
            }
            break;
          }
        }
      }

      // 鳥（空の敵）
      if (!gameOver) {
        for (const b of birds) {
          if (rectsOverlap(playerRect, b)) {
            if (invincibleTimer <= 0) {
              damagePlayer();
            }
            break;
          }
        }
      }

      // アイテム取得（＋フローティングテキスト）
      if (!gameOver) {
        items = items.filter(item => {
          if (rectsOverlap(playerRect, item)) {
            let text = "";
            if (item.type === "score") {
              score += 10;
              playItemSound();
              text = "+10";
            } else if (item.type === "chick") {
              activateChickMode();
              text = "🐥";
            } else if (item.type === "bike") {
              activateBikeMode();
              text = "🚴";
            }
            floatTexts.push({
              x: item.x + item.width / 2,
              y: item.y,
              text,
              life: 0.8
            });
            return false;
          }
          return true;
        });
      }

      // スコア（生存時間）
      if (!gameOver) {
        score += dt * 5;
      }

      // プレイヤーの回転（常に前転）
      // 右向きに見せるため、描画時に左右反転するモードでは
      // 逆向きに回転させると「前転」に見える
      const inNormalMode = !isBikeMode && !isChickMode;
      let rollDir = 1;
      if (isBikeMode || inNormalMode) {
        // scale(-1, 1) するので、見た目上前に転がるように符号反転
        rollDir = -1;
      }
      const ROLL_SPEED = 4.0; // rad/sec
      player.angle += rollDir * ROLL_SPEED * dt;

      // フローティングテキスト更新
      floatTexts = floatTexts.filter(ft => {
        ft.y -= 40 * dt;
        ft.life -= dt;
        return ft.life > 0;
      });

      // オブジェクト生成
      spawnTimer += dt;
      if (spawnTimer >= nextSpawnTime) {
        spawnObject();
        spawnTimer = 0;
        nextSpawnTime = randomRange(0.8, 1.6);
      }

      prevIsTouching = isTouching;
    }

    // ==========================
    // 描画処理
    // ==========================
    function draw() {
      const groundY = getGroundY();

      // 背景
      ctx.fillStyle = "#87ceeb";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 地面
      ctx.fillStyle = "#3c7c1b";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // 穴
      ctx.fillStyle = "#87ceeb";
      for (const hole of holes) {
        ctx.fillRect(hole.x, groundY, hole.width, canvas.height - groundY);
      }

      // 壁・空中床
      ctx.fillStyle = "#8b4513";
      for (const wall of walls) {
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
      }
      ctx.fillStyle = "#cccccc";
      for (const plat of platforms) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      }

      // プレイヤー（回転＋右向き表示）
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      ctx.save();
      ctx.translate(cx, cy);

      const inNormalMode = !isBikeMode && !isChickMode;
      if (isBikeMode || inNormalMode) {
        ctx.scale(-1, 1);  // 右向きに見せる
      }

      ctx.rotate(player.angle);
      ctx.font = "32px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(player.emoji, 0, 0);
      ctx.restore();

      // 亀
      ctx.font = "28px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      for (const t of turtles) {
        ctx.fillText(t.emoji, t.x + t.width / 2, t.y + t.height / 2);
      }

      // キノコ
      for (const m of mushrooms) {
        ctx.fillText(m.emoji, m.x + m.width / 2, m.y + m.height / 2);
      }

      // 鳥（空の敵）
      for (const b of birds) {
        ctx.fillText(b.emoji, b.x + b.width / 2, b.y + b.height / 2);
      }

      // アイテム
      for (const item of items) {
        ctx.fillText(item.emoji, item.x + item.width / 2, item.y + item.height / 2);
      }

      // フローティングテキスト
      for (const ft of floatTexts) {
        const alpha = Math.max(0, ft.life / 0.8);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#ffff00";
        ctx.font = "18px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // ライフ（ハート）
      ctx.fillStyle = "#ff0000";
      ctx.font = "24px system-ui";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("❤️".repeat(lives), 10, 10);

      // スコア（右上）
      ctx.fillStyle = "#000000";
      ctx.font = "20px system-ui";
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.fillText("Score: " + Math.floor(score), canvas.width - 16, 10);

      // ゲームオーバー表示
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font = "36px system-ui";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "24px system-ui";
        ctx.fillText("Score: " + Math.floor(score), canvas.width / 2, canvas.height / 2 + 20);

        ctx.font = "18px system-ui";
        ctx.fillText("画面をタップしてリスタート", canvas.width / 2, canvas.height / 2 + 60);
      }
    }

    // ==========================
    // メインループ
    // ==========================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    // ==========================
    // 初期化
    // ==========================
    function init() {
      resizeCanvas();
      resetGame();
      setupInput();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      resetGame();
    });

    init();
  </script>
</body>
</html>
