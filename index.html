<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>無限横スクロール・ジャンプゲーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #87ceeb; /* 空の色 */
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================
    // 基本設定・グローバル変数
    // ==========================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let player;
    let playerBaseX = 0;          // 通常の基準位置X

    let walls = [];       // 壁（足場、押し戻し）
    let platforms = [];   // 空中床
    let items = [];       // アイテム：スコア・ひよこ・自転車
    let birds = [];       // 空の敵（鳥・爆弾・唐辛子）
    let bees = [];        // 空の敵：蜂（サインカーブで移動）
    let ghosts = [];      // 空の敵：オバケ（進んだり止まったり）
    let turtles = [];     // 地上の敵（亀）
    let mushrooms = [];   // 地上の敵（キノコ）
    let holes = [];       // 穴（地面の切れ目）
    let floatTexts = [];  // アイテム取得時のフローティングテキスト

    let score = 0;
    let gameOver = false;
    let isTouching = false;
    let prevIsTouching = false;

    let lastTime = 0;

    const BASE_SCROLL_SPEED = 240;  // スクロール基本速度（px/sec）
    const GRAVITY = 900;
    const GROUND_RATIO = 0.8;
    const TOP_LIMIT = 20;

    let spawnTimer = 0;
    let nextSpawnTime = 1.0;

    // --- モード管理 ---
    let isChickMode = false;
    let chickTimer = 0;
    const CHICK_MODE_DURATION = 4.0;

    let isBikeMode = false;
    let bikeTimer = 0;
    const BIKE_MODE_DURATION = CHICK_MODE_DURATION * 3;

    // --- ライフ管理 ---
    let lives = 3;
    let invincibleTimer = 0;
    const INVINCIBLE_TIME = 0.8;

    // --- ジャンプ管理 ---
    let jumpUsesLeft = 2;
    let isCurrentlyThrusting = false;

    // --- スワイプ判定 ---
    let touchStartY = null;

    // --- ロスト表示＆一時停止 ---
    let lostMessageTimer = 0;
    let isRespawnPause = false;
    let respawnPauseTimer = 0;

    // ==========================
    // サウンド（BGM + イベント音）
    // ==========================
    let audioCtx = null;
    let bgmOsc1 = null;
    let bgmOsc2 = null;
    let bgmGain = null;

    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
        }
      }
    }

    function resumeAudio() {
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    function startBGM() {
      if (!audioCtx || bgmOsc1) return;

      bgmOsc1 = audioCtx.createOscillator();
      bgmOsc2 = audioCtx.createOscillator();
      bgmGain = audioCtx.createGain();

      bgmOsc1.type = "triangle";
      bgmOsc2.type = "square";
      bgmOsc1.frequency.value = 220; // A3
      bgmOsc2.frequency.value = 330; // E4

      bgmGain.gain.value = 0.04;

      bgmOsc1.connect(bgmGain);
      bgmOsc2.connect(bgmGain);
      bgmGain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      bgmGain.gain.setValueAtTime(0.03, now);
      bgmGain.gain.linearRampToValueAtTime(0.05, now + 2);
      bgmGain.gain.linearRampToValueAtTime(0.03, now + 4);

      bgmOsc1.start();
      bgmOsc2.start();
    }

    function stopBGM() {
      if (bgmOsc1) {
        try { bgmOsc1.stop(); } catch(e){}
        try { bgmOsc2.stop(); } catch(e){}
      }
      bgmOsc1 = null;
      bgmOsc2 = null;
      bgmGain = null;
    }

    function playBeep(f, duration, type = "sine", volume = 0.3) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = f;
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.start(now);
      osc.stop(now + duration + 0.05);
    }

    // イベント別音
    function playScoreItemSound() {
      playBeep(880, 0.10, "sine", 0.25);
      setTimeout(() => playBeep(1320, 0.10, "sine", 0.2), 90);
    }
    function playChickSound() {
      playBeep(660, 0.12, "triangle", 0.3);
      setTimeout(() => playBeep(990, 0.12, "triangle", 0.25), 120);
    }
    function playBikeSound() {
      playBeep(440, 0.10, "square", 0.3);
      setTimeout(() => playBeep(660, 0.10, "square", 0.25), 110);
      setTimeout(() => playBeep(880, 0.10, "square", 0.2), 220);
    }
    function playBikeBonusSound() {
      playBeep(1200, 0.08, "sawtooth", 0.3);
      setTimeout(() => playBeep(1600, 0.12, "sawtooth", 0.25), 80);
    }
    function playHitSound() {
      playBeep(220, 0.25, "square", 0.35);
      setTimeout(() => playBeep(180, 0.25, "square", 0.3), 180);
    }

    // ==========================
    // 画面サイズ・地面
    // ==========================
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      playerBaseX = canvas.width * 0.15;
    }

    function getGroundY() {
      return canvas.height * GROUND_RATIO;
    }

    // ==========================
    // 初期化・リスタート
    // ==========================
    function resetGame() {
      const groundY = getGroundY();
      playerBaseX = canvas.width * 0.15;

      player = {
        x: playerBaseX,
        y: groundY - 40,
        width: 40,
        height: 40,
        vy: 0,
        emoji: "🏃‍♂️",
        angle: 0,
        onGround: true
      };

      walls = [];
      platforms = [];
      items = [];
      birds = [];
      bees = [];
      ghosts = [];
      turtles = [];
      mushrooms = [];
      holes = [];
      floatTexts = [];

      score = 0;
      gameOver = false;
      spawnTimer = 0;
      nextSpawnTime = randomRange(0.8, 1.6);

      isChickMode = false;
      chickTimer = 0;
      isBikeMode = false;
      bikeTimer = 0;

      lives = 3;
      invincibleTimer = 0;

      jumpUsesLeft = 2;
      isCurrentlyThrusting = false;
      prevIsTouching = false;

      lostMessageTimer = 0;
      isRespawnPause = false;
      respawnPauseTimer = 0;
    }

    // ==========================
    // ユーティリティ
    // ==========================
    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function isPlayerOverHole(p) {
      const pxCenter = p.x + p.width / 2;
      for (const hole of holes) {
        if (pxCenter > hole.x && pxCenter < hole.x + hole.width) {
          return true;
        }
      }
      return false;
    }

    // ==========================
    // モード切り替え
    // ==========================
    function activateChickMode() {
      isChickMode = true;
      chickTimer = CHICK_MODE_DURATION;
      if (isBikeMode) {
        isBikeMode = false;
        bikeTimer = 0;
      }
      player.emoji = "🐥";
      playChickSound();
    }

    function activateBikeMode() {
      isBikeMode = true;
      bikeTimer = BIKE_MODE_DURATION;
      if (isChickMode) {
        isChickMode = false;
        chickTimer = 0;
      }
      player.emoji = "🚴";
      playBikeSound();
    }

    function updateModeTimers(dt) {
      if (isChickMode) {
        chickTimer -= dt;
        if (chickTimer <= 0) {
          isChickMode = false;
          chickTimer = 0;
          if (!isBikeMode) player.emoji = "🏃‍♂️";
        }
      }
      if (isBikeMode) {
        bikeTimer -= dt;
        if (bikeTimer <= 0) {
          isBikeMode = false;
          bikeTimer = 0;
          if (!isChickMode) player.emoji = "🏃‍♂️";
        }
      }
    }

    function getCurrentScrollSpeed() {
      if (isRespawnPause) return 0; // ロスト演出中はスクロール停止
      let speed = BASE_SCROLL_SPEED;
      if (isChickMode) speed = BASE_SCROLL_SPEED * 0.6;
      if (isBikeMode)  speed = BASE_SCROLL_SPEED * 1.3;
      return speed;
    }

    // ==========================
    // ダメージ処理
    // ==========================
    function damagePlayer(options = {}) {
      if (invincibleTimer > 0 || gameOver) return;

      lives--;
      playHitSound();
      invincibleTimer = INVINCIBLE_TIME;
      lostMessageTimer = 1.0;

      if (lives <= 0) {
        gameOver = true;
        stopBGM();
        return;
      }

      if (options.respawnFromTop) {
        const groundY = getGroundY();
        player.x = playerBaseX;
        player.y = -player.height - 10;
        player.vy = 300;
        player.onGround = false;

        isChickMode = false;
        chickTimer = 0;
        isBikeMode = false;
        bikeTimer = 0;
        player.emoji = "🏃‍♂️";

        isRespawnPause = true;
        respawnPauseTimer = 1.2;
      }
    }

    // ==========================
    // オブジェクト生成
    // ==========================
    function spawnObject() {
      const groundY = getGroundY();
      const x = canvas.width + 40;
      const r = Math.random();

      // アイテム多めに
      if (r < 0.30) {
        // スコアアイテム
        const foodEmojis = ["🍎", "🍌", "🍕", "🍩", "🍔", "🍇", "🍰", "🍖"];
        items.push({
          type: "score",
          x,
          y: randomRange(groundY * 0.3, groundY - 120),
          width: 28,
          height: 28,
          emoji: foodEmojis[Math.floor(Math.random() * foodEmojis.length)]
        });
      } else if (r < 0.42) {
        // ひよこ
        items.push({
          type: "chick",
          x,
          y: randomRange(groundY * 0.3, groundY - 140),
          width: 30,
          height: 30,
          emoji: "🐣"
        });
      } else if (r < 0.54) {
        // 自転車
        items.push({
          type: "bike",
          x,
          y: randomRange(groundY * 0.3, groundY - 140),
          width: 34,
          height: 34,
          emoji: "🚲"
        });
      } else if (r < 0.64) {
        // 通常の壁
        const wallHeight = randomRange(50, 140);
        walls.push({
          x,
          y: groundY - wallHeight,
          width: 40,
          height: wallHeight
        });
      } else if (r < 0.74) {
        // 階段状の壁
        const stepCount = Math.random() < 0.5 ? 2 : 3;
        const stepWidth = 40;
        const stepHeight = 35;
        for (let i = 0; i < stepCount; i++) {
          const h = stepHeight * (i + 1);
          walls.push({
            x: x + i * stepWidth,
            y: groundY - h,
            width: stepWidth,
            height: h
          });
        }
      } else if (r < 0.82) {
        // 亀
        const h = 32;
        turtles.push({
          x,
          y: groundY - h,
          width: 40,
          height: h,
          emoji: "🐢"
        });
      } else if (r < 0.90) {
        // キノコ
        const h = 32;
        mushrooms.push({
          x,
          y: groundY - h,
          width: 32,
          height: h,
          emoji: "🍄"
        });
      } else if (r < 0.94) {
        // 空の敵：鳥・爆弾・唐辛子
        const h = 32;
        const airEmojis = ["🐦", "💣", "🌶️"];
        birds.push({
          x,
          y: randomRange(80, groundY - 130),
          width: 40,
          height: h,
          emoji: airEmojis[Math.floor(Math.random() * airEmojis.length)]
        });
      } else if (r < 0.97) {
        // 空の敵：蜂（サインカーブ）
        const baseY = randomRange(80, groundY - 140);
        const amp = randomRange(20, 50);
        const omega = randomRange(2, 4);
        bees.push({
          x,
          baseY,
          y: baseY,
          width: 40,
          height: 32,
          emoji: "🐝",
          phase: Math.random() * Math.PI * 2,
          amp,
          omega
        });
      } else if (r < 0.985) {
        // 空の敵：オバケ（進んだり止まったり）
        const baseY = randomRange(80, groundY - 130);
        ghosts.push({
          x,
          baseY,
          y: baseY,
          width: 40,
          height: 32,
          emoji: "👻",
          phase: Math.random() * Math.PI * 2,
          moveState: 1,                     // 1:動く, 0:止まる
          moveTimer: randomRange(0.3, 0.8)
        });
      } else {
        // 穴（地面の切れ目）
        const holeWidth = randomRange(80, 140);
        holes.push({
          x,
          width: holeWidth
        });
      }
    }

    // ==========================
    // 入力（タップ・スワイプ）
    // ==========================
    function handleTouchStart(e) {
      e.preventDefault();

      if (!audioCtx) {
        initAudio();
      } else {
        resumeAudio();
      }
      startBGM();

      if (gameOver) {
        resetGame();
      }
      isTouching = true;

      const t = e.touches[0];
      touchStartY = t.clientY;
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
      touchStartY = null;
    }

    function handleTouchMove(e) {
      e.preventDefault();
      if (e.touches.length === 0) return;
      const t = e.touches[0];
      if (touchStartY === null) touchStartY = t.clientY;
      const dy = t.clientY - touchStartY;

      // 下スワイプで高速落下
      if (dy > 40 && !player.onGround && !gameOver) {
        isTouching = false;
        isCurrentlyThrusting = false;
        jumpUsesLeft = 0;
        if (player.vy < 900) player.vy = 900;
      }
    }

    function setupInput() {
      canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
      canvas.addEventListener("touchend", handleTouchEnd, { passive: false });
      canvas.addEventListener("touchmove", handleTouchMove, { passive: false });

      document.addEventListener("touchmove", function (e) {
        e.preventDefault();
      }, { passive: false });

      // PCテスト用
      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        if (!audioCtx) {
          initAudio();
        } else {
          resumeAudio();
        }
        startBGM();
        if (gameOver) {
          resetGame();
        }
        isTouching = true;
      });
      canvas.addEventListener("mouseup", (e) => {
        e.preventDefault();
        isTouching = false;
      });
      canvas.addEventListener("mouseleave", () => {
        isTouching = false;
      });
    }

    // ==========================
    // ゲーム更新
    // ==========================
    function update(dt) {
      if (gameOver) return;

      const groundY = getGroundY();

      // タイマー類
      if (invincibleTimer > 0) {
        invincibleTimer -= dt;
        if (invincibleTimer < 0) invincibleTimer = 0;
      }
      if (lostMessageTimer > 0) {
        lostMessageTimer -= dt;
        if (lostMessageTimer < 0) lostMessageTimer = 0;
      }
      if (isRespawnPause) {
        respawnPauseTimer -= dt;
        if (respawnPauseTimer < 0) respawnPauseTimer = 0;
      }

      updateModeTimers(dt);

      const scrollSpeed = getCurrentScrollSpeed();
      const scroll = scrollSpeed * dt;

      // タップのON/OFFでジャンプ回数管理
      if (!isTouching && prevIsTouching) {
        if (isCurrentlyThrusting) {
          jumpUsesLeft = Math.max(0, jumpUsesLeft - 1);
          isCurrentlyThrusting = false;
        }
      }

      if (isTouching && !gameOver && !isRespawnPause) {
        if (!isCurrentlyThrusting && jumpUsesLeft > 0) {
          isCurrentlyThrusting = true;
        }
      }

      if (isCurrentlyThrusting) {
        player.vy = -300;
      } else {
        player.vy += GRAVITY * dt;
      }

      const prevY = player.y;
      player.y += player.vy * dt;

      // 上限＆強制落下開始
      if (player.y < TOP_LIMIT) {
        player.y = TOP_LIMIT;
        if (player.vy < 0) player.vy = 0;
        if (isCurrentlyThrusting) {
          isCurrentlyThrusting = false;
          jumpUsesLeft = Math.max(0, jumpUsesLeft - 1);
        }
      }

      let playerBottom = player.y + player.height;
      let playerTop = player.y;

      // 足場（壁＋空中床）：縦方向
      const solids = platforms.concat(walls);
      let onPlatform = false;

      for (const solid of solids) {
        const overlapX =
          player.x + player.width > solid.x &&
          player.x < solid.x + solid.width;
        if (!overlapX) continue;

        // 上から着地
        if (
          player.vy >= 0 &&
          playerBottom >= solid.y &&
          playerBottom <= solid.y + solid.height
        ) {
          player.y = solid.y - player.height;
          player.vy = 0;
          playerBottom = player.y + player.height;
          playerTop = player.y;
          onPlatform = true;
          break;
        }

        // 下からぶつかったら上に抜けない
        if (
          player.vy < 0 &&
          playerTop <= solid.y + solid.height &&
          prevY >= solid.y + solid.height
        ) {
          player.y = solid.y + solid.height;
          player.vy = 0;
          playerTop = player.y;
          playerBottom = player.y + player.height;
          break;
        }
      }

      // 地面・穴：穴の上なら落ち続ける、そうでなければ地面で止まる
      let onGroundNow = false;
      if (!onPlatform && player.vy >= 0 && playerBottom >= groundY) {
        if (!isPlayerOverHole(player)) {
          player.y = groundY - player.height;
          player.vy = 0;
          playerBottom = player.y + player.height;
          playerTop = player.y;
          onGroundNow = true;
        }
        // 穴の上のときはそのまま下に落ちる → 画面外でロスト処理へ
      }

      player.onGround = onGroundNow || onPlatform;

      // 画面下まで落ちたらロスト（穴や崖落ち）
      if (player.y > canvas.height && invincibleTimer <= 0) {
        damagePlayer({ respawnFromTop: true });
      }

      // 足場に立っているときはジャンプ回数リセット
      if (player.onGround && player.vy === 0) {
        jumpUsesLeft = 2;
        if (!isTouching) {
          isCurrentlyThrusting = false;
        }
      }

      // 背景オブジェクトの移動
      function moveAndFilter(list) {
        return list
          .map(obj => {
            obj.x -= scroll;
            return obj;
          })
          .filter(obj => obj.x + (obj.width || 0) > -50);
      }

      walls = moveAndFilter(walls);
      platforms = moveAndFilter(platforms);
      items = moveAndFilter(items);
      birds = moveAndFilter(birds);
      turtles = moveAndFilter(turtles);
      mushrooms = moveAndFilter(mushrooms);

      holes = holes
        .map(hole => {
          hole.x -= scroll;
          return hole;
        })
        .filter(hole => hole.x + hole.width > -50);

      // 蜂：横はスクロール、縦はサインカーブ
      bees = moveAndFilter(bees);
      for (const bee of bees) {
        bee.phase += bee.omega * dt;
        bee.y = bee.baseY + bee.amp * Math.sin(bee.phase);
      }

      // オバケ：進んだり止まったり＋上下ふわふわ
      ghosts = ghosts.filter(g => {
        if (g.moveState === 1) {
          g.x -= scroll;
        }
        g.moveTimer -= dt;
        if (g.moveTimer <= 0) {
          g.moveState = g.moveState === 1 ? 0 : 1;
          g.moveTimer = randomRange(0.3, 0.8);
        }
        g.phase += 1.5 * dt;
        g.y = g.baseY + 10 * Math.sin(g.phase);
        return g.x + g.width > -50;
      });

      // 壁の横衝突：押し戻す
      let playerRect = {
        x: player.x,
        y: player.y,
        width: player.width,
        height: player.height
      };

      let pushedByWall = false;
      for (const wall of walls) {
        const wallRect = {
          x: wall.x,
          y: wall.y,
          width: wall.width,
          height: wall.height
        };
        if (rectsOverlap(playerRect, wallRect)) {
          player.x = wall.x - player.width;
          playerRect.x = player.x;
          pushedByWall = true;
        }
      }

      // 壁に押し出されて画面外 → ロスト＋上から新しい自分
      if (player.x + player.width < 0 && invincibleTimer <= 0) {
        damagePlayer({ respawnFromTop: true });
        playerRect.x = player.x;
        playerRect.y = player.y;
      }

      // 壁を抜けたら基準位置に戻る
      if (!pushedByWall && player.x < playerBaseX && !isRespawnPause) {
        const returnSpeed = 300;
        player.x += returnSpeed * dt;
        if (player.x > playerBaseX) player.x = playerBaseX;
        playerRect.x = player.x;
      }

      // 敵との当たり判定
      function handleEnemyHit() {
        if (isBikeMode) {
          isBikeMode = false;
          bikeTimer = 0;
          if (!isChickMode) player.emoji = "🏃‍♂️";
        } else if (invincibleTimer <= 0) {
          damagePlayer({ respawnFromTop: true });
        }
      }

      for (const t of turtles) {
        if (rectsOverlap(playerRect, t)) {
          handleEnemyHit();
          break;
        }
      }
      if (!gameOver) {
        for (const m of mushrooms) {
          if (rectsOverlap(playerRect, m)) {
            handleEnemyHit();
            break;
          }
        }
      }
      if (!gameOver) {
        for (const b of birds) {
          if (rectsOverlap(playerRect, b)) {
            handleEnemyHit();
            break;
          }
        }
      }
      if (!gameOver) {
        for (const bee of bees) {
          const beeRect = {
            x: bee.x,
            y: bee.y,
            width: bee.width,
            height: bee.height
          };
          if (rectsOverlap(playerRect, beeRect)) {
            handleEnemyHit();
            break;
          }
        }
      }
      if (!gameOver) {
        for (const g of ghosts) {
          const gRect = {
            x: g.x,
            y: g.y,
            width: g.width,
            height: g.height
          };
          if (rectsOverlap(playerRect, gRect)) {
            handleEnemyHit();
            break;
          }
        }
      }

      // アイテム取得
      if (!gameOver) {
        items = items.filter(item => {
          if (rectsOverlap(playerRect, item)) {
            let text = "";
            if (item.type === "score") {
              score += 10;
              playScoreItemSound();
              text = "+10";
            } else if (item.type === "chick") {
              activateChickMode();
              text = "🐥";
            } else if (item.type === "bike") {
              const wasBike = isBikeMode;
              if (wasBike) {
                score += 20;
                playBikeBonusSound();
                text = "+20";
              } else {
                text = "🚴";
              }
              activateBikeMode();
            }
            floatTexts.push({
              x: item.x + item.width / 2,
              y: item.y,
              text,
              life: 0.8
            });
            return false;
          }
          return true;
        });
      }

      // スコア（生存時間）※ロスト演出中は増えない
      if (!gameOver && !isRespawnPause) {
        score += dt * 5;
      }

      // プレイヤーの回転（前転）
      const inNormalMode = !isBikeMode && !isChickMode;
      let rollDir = 1;
      if (isBikeMode || inNormalMode) {
        rollDir = -1; // 右向き描画なので符号反転で前転に見せる
      }
      const ROLL_SPEED = 4.0;
      player.angle += rollDir * ROLL_SPEED * dt;

      // フローティングテキスト
      floatTexts = floatTexts.filter(ft => {
        ft.y -= 40 * dt;
        ft.life -= dt;
        return ft.life > 0;
      });

      // オブジェクト生成（ロスト一時停止中は生成しない）
      if (!isRespawnPause) {
        spawnTimer += dt;
        if (spawnTimer >= nextSpawnTime) {
          spawnObject();
          spawnTimer = 0;
          nextSpawnTime = randomRange(0.8, 1.6);
        }
      }

      // リスポーン一時停止解除：
      if (isRespawnPause && respawnPauseTimer <= 0 && player.onGround) {
        isRespawnPause = false;
      }

      prevIsTouching = isTouching;
    }

    // ==========================
    // 描画
    // ==========================
    function draw() {
      const groundY = getGroundY();

      // 背景
      ctx.fillStyle = "#87ceeb";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 地面
      ctx.fillStyle = "#3c7c1b";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // 穴（地面をくり抜く）
      ctx.fillStyle = "#87ceeb";
      for (const hole of holes) {
        ctx.fillRect(hole.x, groundY, hole.width, canvas.height - groundY);
      }

      // 壁
      ctx.fillStyle = "#8b4513";
      for (const wall of walls) {
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
      }

      // 空中床
      ctx.fillStyle = "#cccccc";
      for (const plat of platforms) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      }

      // プレイヤー
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      ctx.save();
      ctx.translate(cx, cy);

      const inNormalMode = !isBikeMode && !isChickMode;
      if (isBikeMode || inNormalMode) {
        ctx.scale(-1, 1);
      }

      ctx.rotate(player.angle);
      ctx.font = "32px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(player.emoji, 0, 0);
      ctx.restore();

      // 敵・空中敵・アイテム
      ctx.font = "28px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      for (const t of turtles) {
        ctx.fillText(t.emoji, t.x + t.width / 2, t.y + t.height / 2);
      }
      for (const m of mushrooms) {
        ctx.fillText(m.emoji, m.x + m.width / 2, m.y + m.height / 2);
      }
      for (const b of birds) {
        ctx.fillText(b.emoji, b.x + b.width / 2, b.y + b.height / 2);
      }
      for (const bee of bees) {
        ctx.fillText(bee.emoji, bee.x + bee.width / 2, bee.y + bee.height / 2);
      }
      for (const g of ghosts) {
        ctx.fillText(g.emoji, g.x + g.width / 2, g.y + g.height / 2);
      }
      for (const item of items) {
        ctx.fillText(item.emoji, item.x + item.width / 2, item.y + item.height / 2);
      }

      // フローティングテキスト
      for (const ft of floatTexts) {
        const alpha = Math.max(0, ft.life / 0.8);
        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#ffff00";
        ctx.font = "18px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      }

      // ライフ
      ctx.fillStyle = "#ff0000";
      ctx.font = "24px system-ui";
      ctx.textAlign = "left";
      ctx.textBaseline = "top";
      ctx.fillText("❤️".repeat(lives), 10, 10);

      // スコア
      ctx.fillStyle = "#000000";
      ctx.font = "20px system-ui";
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.fillText("Score: " + Math.floor(score), canvas.width - 16, 10);

      // LOST 表示
      if (lostMessageTimer > 0 && !gameOver) {
        ctx.save();
        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4444";
        ctx.font = "32px system-ui";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("LOST!", canvas.width / 2, canvas.height / 2);
        ctx.restore();
      }

      // Game Over
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font = "36px system-ui";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "24px system-ui";
        ctx.fillText("Score: " + Math.floor(score), canvas.width / 2, canvas.height / 2 + 20);

        ctx.font = "18px system-ui";
        ctx.fillText("画面をタップしてリスタート", canvas.width / 2, canvas.height / 2 + 60);
      }
    }

    // ==========================
    // メインループ
    // ==========================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    // ==========================
    // 初期化
    // ==========================
    function init() {
      resizeCanvas();
      resetGame();
      setupInput();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      resetGame();
    });

    init();
  </script>
</body>
</html>
