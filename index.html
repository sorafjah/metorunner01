<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1.0, initial-scale=1.0, user-scalable=no">
    <title>無限横スクロール・ジャンプゲーム - メダルフィーバー版</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #333;
            font-family: 'Arial', sans-serif;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
            background-color: #87CEEB; /* 初期空色（実際の背景はJSで描画） */
            touch-action: none;
        }
        #audio-elements {
            display: none; /* オーディオ要素は表示しない */
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="audio-elements">
    <!-- BGM -->
    <audio id="bgm" loop preload="auto">
        <source src="data:audio/wav;base64,UklGRlIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABITUNyZXMxAAACAGFnZwAAAAAAAAAAU2FtcGxlcyAAAAAAAACZc3R1ZioAAABkYXRhAAAAAAoBAAAAAEAAAAABAAAAAAAAAAAAAAAAYAAAAA==" type="audio/wav">
    </audio>
    <!-- ジャンプ音 -->
    <audio id="jumpSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABITUNyZXMxAAACAGFnZwAAAAAAAAAAU2FtcGxlcyAAAAAAAABuAAAAAA==" type="audio/wav">
    </audio>
    <!-- アイテム取得音 -->
    <audio id="itemSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRi4AAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABITUNyZXMxAAACAGFnZwAAAAAAAAAAU2FtcGxlcyAAAAAAAACkAAAAAA==" type="audio/wav">
    </audio>
    <!-- 障害物飛び越え音 -->
    <audio id="clearSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRjIAAWF2aXN0Zm10IBIAAAABAAEARx8AAGAfAAABAAgAAABITUNyZXMxAAACAGFnZwAAAAAAAAAAU2FtcGxlcyAAAAAAAACIAAAASmRhdGEBAEBAQEBAPDw8PDw7Ozs7Ozo6Ojo6Og==" type="audio/wav">
    </audio>
    <!-- ゲームオーバー音 (ダメージ音) -->
    <audio id="gameOverSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRiYAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAAABITUNyZXMxAAACAGFnZwAAAAAAAAAAU2FtcGxlcyAAAAAAAADIAAAAAA==" type="audio/wav">
    </audio>
</div>

<script>
    // --- 1. 初期設定と変数定義 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let canvasWidth = window.innerWidth;
    let canvasHeight = window.innerHeight;
    canvas.width = canvasWidth;
    canvas.height = canvasHeight;

    // 音源要素の取得
    const bgm = document.getElementById('bgm');
    const jumpSound = document.getElementById('jumpSound');
    const itemSound = document.getElementById('itemSound');
    const clearSound = document.getElementById('clearSound');
    const gameOverSound = document.getElementById('gameOverSound'); // ダメージ音として使用

    let isGameOver = false;
    let isGameStarted = false; // BGM再生管理用のフラグ
    let score = 0;
    let gameSpeed = 4;  // 難易度で上書きされる
    let lives = 3;      // 難易度で上書きされる
    let bestScore = Number(localStorage.getItem('bestScore') || 0);
    let animationId;
    let frameCount = 0;
    let lastSpeedUpScore = 0; // スピードアップをした時点のスコア
    let hasLostOnce = false;  // 1回でもゲームオーバーしたかどうか（ひよこスタート用）

    const groundHeight = 50;

    // コンボ関連
    let combo = 0;
    let comboTimer = 0; // コンボ継続猶予フレーム

    // フィーバー関連
    let feverGauge = 0;   // 0〜100（残り時間表示用）
    let isFever = false;
    let feverTimer = 0;   // フィーバー時間
    const FEVER_DURATION = 60 * 5; // 約5秒

    // 難易度（必要なら 'easy', 'normal', 'hard' に書き換え）
    let difficulty = 'normal';
    function applyDifficultySettings() {
        if (difficulty === 'easy') {
            gameSpeed = 3;
            lives = 5;
        } else if (difficulty === 'hard') {
            gameSpeed = 5;
            lives = 2;
        } else {
            gameSpeed = 4;
            lives = 3;
        }
    }
    applyDifficultySettings();

    // 主人公 (Player)
    const playerSize = 40;
    let baseEmoji = '🏃';  // 通常時のベースキャラ（後で🐥に変わることもある）
    let player = {
        x: 50,
        y: canvasHeight - groundHeight - playerSize,
        width: playerSize * 0.8,
        height: playerSize * 0.8,
        dy: 0,
        gravity: 0.8,
        jumpPower: 14,
        isJumping: false,
        extraJumpUsed: false, // 追加ジャンプ（2段ジャンプ）したかどうか
        swingPhase: 0,        // 揺れ用フェーズ
        rotation: 0,          // 揺れ角度
        isInvincible: false,  // 無敵状態フラグ
        invincibleTimer: 0,   // 無敵時間タイマー
        emoji: baseEmoji      // プレイヤーの絵文字
    };

    // ゲーム要素 (障害物、アイテム) の配列
    let elements = []; // { x, y, width, height, type, emoji, cleared }

    // ポップアップ表示用の配列
    let popups = []; // { x, y, text, color, dy, opacity }

    // アイテムと障害物の絵文字リスト
    const itemEmojis = ['🍔', '🍰', '🍇', '🍌', '🍕', '🍩']; // 通常アイテム
    const medalEmojis = ['🥇', '🥈', '🥉', '🏅'];           // メダルアイテム（フィーバー用）
    const groundObstacleEmojis = ['🐢', '🍄', '🌵', '🚧']; // 地上障害物
    const airObstacleEmojis = ['🦅', '🦇', '🐝', '☁️'];   // 空中障害物
    const wallEmojis = ['🧱', '🏛️', '🗼'];               // 壁の絵文字

    // --- 2. 汎用：スクロール速度（フィーバー中は加速） ---
    function getScrollSpeed() {
        return gameSpeed + (isFever ? 2 : 0); // フィーバー中は +2 速く
    }

    // --- 3. フィーバー開始処理 ---
    function startFever() {
        isFever = true;
        feverTimer = FEVER_DURATION;
        feverGauge = 100;
        player.isInvincible = true;
        player.emoji = '🚲'; // 自転車に変身
    }

    // --- 4. イベントリスナー (操作) ---

    // BGMや効果音を初期化・アンロックするための関数
    function unlockAudioContext() {
        if (isGameStarted) return;

        console.log("First interaction: Unlocking audio context...");
        bgm.volume = 0.5;

        const allAudio = [bgm, jumpSound, itemSound, clearSound, gameOverSound];

        allAudio.forEach(audio => {
            const playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    if (audio !== bgm) {
                        audio.pause();
                        audio.currentTime = 0;
                    }
                }).catch(error => {
                    console.log(`Audio unlock failed for ${audio.id}:`, error);
                });
            }
        });

        isGameStarted = true;
    }

    canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();

        // 最初のタップでオーディオをアンロック
        if (!isGameStarted) {
            unlockAudioContext();
            // BGM開始
            bgm.currentTime = 0;
            bgm.play().catch(err => console.log("BGM start failed", err));
        }

        if (isGameOver) {
            restartGame();
        } else {
            let didJump = false;

            // 1回目のジャンプ（地面 or プラットフォーム上）
            if (!player.isJumping) {
                player.dy = -player.jumpPower;
                player.isJumping = true;
                player.extraJumpUsed = false;
                didJump = true;
            }
            // 2回目の追加ジャンプ（空中で1回だけ）
            else if (!player.extraJumpUsed) {
                player.dy = -player.jumpPower;
                player.extraJumpUsed = true;
                didJump = true;
            }

            if (didJump && isGameStarted) {
                jumpSound.currentTime = 0;
                jumpSound.play().catch(e2 => console.log("Jump sound failed", e2));
            }
        }
    });

    canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        // ボタン押しっぱなしジャンプではないので、特に何もしない
    });

    window.addEventListener('resize', () => {
        canvasWidth = window.innerWidth;
        canvasHeight = window.innerHeight;
        canvas.width = canvasWidth;
        canvas.height = canvasHeight;
        if (player.y > canvasHeight - groundHeight - playerSize) {
            player.y = canvasHeight - groundHeight - playerSize;
        }
    });

    // --- 5. 主人公 (Player) の更新と描画 ---

    function updatePlayer() {
        player.dy += player.gravity;
        player.y += player.dy;

        const groundY = canvasHeight - groundHeight - playerSize;
        let onPlatform = false;

        // 階段状の壁に乗っているかチェック
        for (let el of elements) {
            if (el.type === 'stepWall' && player.dy >= 0) {
                const playerBottom = player.y + player.height;
                const playerRight = player.x + player.width;

                if (playerRight > el.x && player.x < el.x + el.width &&
                    playerBottom >= el.y && playerBottom <= el.y + player.height / 2) {
                    player.y = el.y - player.height;
                    player.dy = 0;
                    onPlatform = true;
                    player.isJumping = false;
                    player.extraJumpUsed = false;
                    break;
                }
            }
        }

        // 地面に着地
        if (!onPlatform && player.y >= groundY) {
            player.y = groundY;
            player.dy = 0;
            player.isJumping = false;
            player.extraJumpUsed = false;
        } else if (player.y < 0) { // 画面上部制限
            player.y = 0;
            player.dy = 0;
        }

        // 揺れ(小さく左右にゆらゆら) - フィーバー中は少し大きく揺れる
        player.swingPhase += player.isJumping ? 0.25 : 0.15;
        const swingAmp = isFever ? 0.6 : 0.3;
        player.rotation = swingAmp * Math.sin(player.swingPhase);

        // 無敵時間の更新
        if (player.isInvincible && !isFever) {
            // フィーバー以外の無敵（ダメージ後の一瞬無敵）のみタイマーで管理
            player.invincibleTimer--;
            if (player.invincibleTimer <= 0) {
                player.isInvincible = false;
            }
        }
    }

    function drawPlayer() {
        ctx.save();

        // 無敵中は点滅させる
        if (player.isInvincible) {
            if (Math.floor(player.invincibleTimer / 10) % 2 === 0 && !isFever) {
                ctx.globalAlpha = 0.5;
            }
        }

        ctx.translate(player.x + player.width / 2, player.y + player.height / 2);
        ctx.rotate(player.rotation);
        ctx.scale(-1, 1); // 右向きにするため左右反転

        ctx.font = `${playerSize}px Arial`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(player.emoji, 0, 0);

        ctx.restore();
    }

    // --- 6. 背景の描画（ステージチェンジ＋フィーバー考慮） ---
    function drawBackground() {
        if (isFever) {
            // フィーバー中は金色っぽく
            ctx.fillStyle = '#FFD700';
        } else if (score < 300) {
            // 昼
            ctx.fillStyle = '#87CEEB';
        } else if (score < 700) {
            // 夕方
            ctx.fillStyle = '#FFA500';
        } else {
            // 夜
            ctx.fillStyle = '#191970';
        }
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);
    }

    // --- 7. ゲーム要素 (障害物・アイテム) の管理 ---

    function spawnElements() {
        frameCount++;

        let speedForSpawn = getScrollSpeed();
        let baseInterval = Math.floor(90 / (speedForSpawn / 4));
        if (difficulty === 'easy') baseInterval += 10;
        if (difficulty === 'hard') baseInterval -= 10;
        if (baseInterval < 30) baseInterval = 30;

        if (frameCount % baseInterval === 0) {
            const randomType = Math.random();
            const elementSize = 40;
            const groundY = canvasHeight - groundHeight;

            const lastElement = elements[elements.length - 1];
            const canSpawnHole = !lastElement || (lastElement.type !== 'hole' && lastElement.x < canvasWidth - 100);

            if (randomType < 0.1 && canSpawnHole) {
                // 10% 穴
                elements.push({
                    x: canvasWidth,
                    y: groundY,
                    width: 80 + Math.random() * 40,
                    height: groundHeight,
                    type: 'hole',
                    emoji: '',
                    cleared: false
                });
            } else if (randomType < 0.3) {
                // 20% 壁 (ランダムな高さ、階段状も含む)
                let wallHeight = elementSize + Math.random() * 50;
                let wallType = 'wall';
                if (Math.random() < 0.3) { wallHeight = elementSize * 2 + Math.random() * 50; }

                if (Math.random() < 0.4 && wallHeight > elementSize + 20) {
                    wallType = 'stepWall';
                    const numSteps = 1 + Math.floor(Math.random() * 2);
                    const stepHeight = wallHeight / numSteps;
                    const stepWidth = (elementSize * 1.5) / numSteps;

                    for (let i = 0; i < numSteps; i++) {
                        elements.push({
                            x: canvasWidth + i * stepWidth,
                            y: groundY - (i + 1) * stepHeight,
                            width: stepWidth,
                            height: (i + 1) * stepHeight,
                            type: 'stepWall',
                            emoji: wallEmojis[Math.floor(Math.random() * wallEmojis.length)],
                            color: '#A0522D',
                            cleared: false
                        });
                    }
                } else {
                    elements.push({
                        x: canvasWidth,
                        y: groundY - wallHeight,
                        width: elementSize + Math.random() * 20,
                        height: wallHeight,
                        type: wallType,
                        emoji: wallEmojis[Math.floor(Math.random() * wallEmojis.length)],
                        color: '#8B4513',
                        cleared: false
                    });
                }
            } else if (randomType < 0.5) {
                // 20% 地上障害物
                elements.push({
                    x: canvasWidth,
                    y: groundY - elementSize,
                    width: elementSize,
                    height: elementSize,
                    type: 'groundObstacle',
                    emoji: groundObstacleEmojis[Math.floor(Math.random() * groundObstacleEmojis.length)],
                    cleared: false
                });
            } else if (randomType < 0.7) {
                // 20% 空中敵
                const randomY = Math.random() * (canvasHeight - groundHeight - playerSize * 3) + playerSize;
                elements.push({
                    x: canvasWidth,
                    y: randomY,
                    width: elementSize,
                    height: elementSize,
                    type: 'airObstacle',
                    emoji: airObstacleEmojis[Math.floor(Math.random() * airObstacleEmojis.length)],
                    cleared: false
                });
            } else {
                // 30% アイテム（通常アイテム or メダル）
                const randomY = Math.random() * (canvasHeight - groundHeight - playerSize * 2);
                const isMedal = Math.random() < 0.3; // 30%くらいはメダル
                elements.push({
                    x: canvasWidth,
                    y: randomY,
                    width: 30,
                    height: 30,
                    type: isMedal ? 'medal' : 'item',
                    emoji: isMedal
                        ? medalEmojis[Math.floor(Math.random() * medalEmojis.length)]
                        : itemEmojis[Math.floor(Math.random() * itemEmojis.length)],
                    cleared: false
                });
            }
        }
    }

    function updateAndDrawElements() {
        ctx.font = '40px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        const currentSpeed = getScrollSpeed();

        for (let i = elements.length - 1; i >= 0; i--) {
            let el = elements[i];
            el.x -= currentSpeed;

            if (el.type === 'hole') {
                // 描画なし（地面側で処理）
            } else if (el.type === 'wall' || el.type === 'stepWall') {
                ctx.fillStyle = el.color || '#8B4513';
                ctx.fillRect(el.x, el.y, el.width, el.height);
                ctx.font = '30px Arial';
                ctx.fillText(el.emoji, el.x + el.width / 2 - 15, el.y + el.height / 2 - 15);
            } else {
                ctx.font = '40px Arial';
                ctx.fillText(el.emoji, el.x, el.y);
            }

            if (el.x + el.width < 0) {
                elements.splice(i, 1);
            }
        }
    }

    // --- 8. 地面の描画 (穴を考慮) ---

    function drawGround() {
        ctx.fillStyle = '#4CAF50';

        let currentX = 0;
        let sortedHoles = elements
            .filter(el => el.type === 'hole')
            .sort((a, b) => a.x - b.x);

        for (let hole of sortedHoles) {
            if (hole.x > currentX) {
                ctx.fillRect(currentX, canvasHeight - groundHeight, hole.x - currentX, groundHeight);
            }
            currentX = hole.x + hole.width;
        }

        if (currentX < canvasWidth) {
            ctx.fillRect(currentX, canvasHeight - groundHeight, canvasWidth - currentX, groundHeight);
        }
    }

    // --- 9. スコア加算（コンボ・フィーバー対応） ---

    function addScore(base, popupX, popupY, color) {
        combo++;
        comboTimer = 60; // 約1秒以内に成功するとコンボ継続

        let effectiveBase = base;
        if (isFever) {
            // フィーバー中は得点2倍
            effectiveBase = base * 2;
        }

        const multiplier = 1 + combo * 0.2; // 1.0, 1.2, 1.4...
        const gained = Math.floor(effectiveBase * multiplier);
        score += gained;

        if (base > 0) { // baseが0のときはポップアップ不要ならここで制御してもOK
            popups.push({
                x: popupX,
                y: popupY,
                text: `+${gained}`,
                color: color || 'white',
                dy: -2,
                opacity: 1
            });
        }
    }

    // --- 10. 当たり判定とスコア加算、ポップアップ表示 ---

    function checkCollisions() {
        // 無敵中（フィーバー）の場合、ダメージ判定はスキップ（飛び越え判定だけ別関数で実施）
        if (isFever) {
            checkClearance();
            return;
        }

        for (let i = elements.length - 1; i >= 0; i--) {
            let el = elements[i];

            const isColliding =
                player.x < el.x + el.width &&
                player.x + player.width > el.x &&
                player.y < el.y + el.height &&
                player.y + player.height > el.y;

            if (isColliding) {
                if (el.type === 'item') {
                    // 通常アイテム取得（フィーバーは発動しない）
                    addScore(30, el.x, el.y, 'gold');

                    itemSound.currentTime = 0;
                    itemSound.play().catch(e => console.log("Item sound failed", e));
                    elements.splice(i, 1);

                } else if (el.type === 'medal') {
                    // メダル取得 → 即フィーバータイム
                    // フィーバー自体が美味しいので、直接の得点は控えめ（または0でもOK）
                    addScore(10, el.x, el.y, 'gold');

                    itemSound.currentTime = 0;
                    itemSound.play().catch(e => console.log("Medal sound failed", e));

                    startFever();
                    elements.splice(i, 1);

                } else if (
                    el.type === 'wall' || el.type === 'groundObstacle' || el.type === 'airObstacle' || el.type === 'stepWall' ||
                    (el.type === 'hole' && player.y + player.height >= canvasHeight - groundHeight)
                ) {
                    // 障害物、敵、または穴に落ちた
                    lives--;
                    combo = 0;
                    comboTimer = 0;

                    gameOverSound.currentTime = 0;
                    gameOverSound.play().catch(e => console.log("Damage sound failed", e));

                    if (lives <= 0) {
                        isGameOver = true;
                        hasLostOnce = true; // 1回でもゲームオーバーしたことを記録
                    } else {
                        // まだライフが残っている → しばらく無敵
                        player.isInvincible = true;
                        player.invincibleTimer = 120; // 2秒間の無敵 (60fps * 2s)

                        if (el.type !== 'hole') {
                            // 穴以外は、当たった障害物を消す
                            elements.splice(i, 1);
                        } else {
                            // 穴に落ちた場合は、プレイヤーを地面に戻して少し跳ね返る
                            player.y = canvasHeight - groundHeight - playerSize;
                            player.dy = -player.jumpPower * 0.5;
                            player.isJumping = true;
                            player.extraJumpUsed = false;
                        }
                    }
                }
            }
        }

        checkClearance(); // 飛び越え判定
    }

    // 飛び越え判定を分離
    function checkClearance() {
        for (let el of elements) {
            if (el.cleared) continue; // 既に加点済みのものはスキップ

            // プレイヤーが障害物を完全に越えたか
            if (player.x > el.x + el.width) {
                if (
                    (el.type === 'wall' || el.type === 'groundObstacle' || el.type === 'hole' || el.type === 'stepWall') &&
                    player.y < canvasHeight - groundHeight - player.height / 2
                ) {
                    addScore(10, el.x, el.y, 'lightgreen');
                    clearSound.currentTime = 0;
                    clearSound.play().catch(e => console.log("Clear sound failed", e));
                    el.cleared = true;
                } else if (el.type === 'airObstacle' && player.y < el.y + el.height) {
                    addScore(20, el.x, el.y, 'skyblue');
                    clearSound.currentTime = 0;
                    clearSound.play().catch(e => console.log("Clear sound failed", e));
                    el.cleared = true;
                }
            }
        }
    }

    // --- 11. UI (スコア・ライフ・コンボ・フィーバーゲージ・ポップアップ) 描画 ---

    function drawUI() {
        // スコア・ベストスコア描画
        ctx.fillStyle = 'black';
        ctx.font = '24px Arial';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'top';
        ctx.fillText(`Score: ${score}`, canvasWidth - 20, 20);
        ctx.fillText(`Best: ${bestScore}`, canvasWidth - 20, 50);

        // ライフ描画
        let hearts = '';
        for (let i = 0; i < lives; i++) {
            hearts += '❤️';
        }
        ctx.fillStyle = 'red';
        ctx.font = '24px Arial';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';
        ctx.fillText(hearts, 20, 20);

        // コンボ表示
        if (combo > 0) {
            ctx.fillStyle = 'yellow';
            ctx.font = '18px Arial';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(`Combo: ${combo}`, 20, 50);
        }

        // フィーバーゲージ（残り時間バー）
        const barWidth = 200;
        const barHeight = 10;
        const barX = (canvasWidth - barWidth) / 2;
        const barY = 20;

        ctx.lineWidth = 2;
        ctx.strokeStyle = 'white';
        ctx.strokeRect(barX, barY, barWidth, barHeight);

        ctx.fillStyle = isFever ? 'gold' : 'deepskyblue';
        ctx.fillRect(barX, barY, barWidth * (feverGauge / 100), barHeight);

        if (isFever) {
            ctx.fillStyle = 'black';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';
            ctx.fillText('FEVER!!', canvasWidth / 2, barY + 14);
        }
    }

    function drawPopups() {
        for (let i = popups.length - 1; i >= 0; i--) {
            let p = popups[i];
            p.y += p.dy;
            p.opacity -= 0.02;

            if (p.opacity <= 0) {
                popups.splice(i, 1);
            } else {
                let colorString = '255, 255, 255'; // default white
                if (p.color === 'gold') colorString = '255, 215, 0';
                else if (p.color === 'lightgreen') colorString = '144, 238, 144';
                else if (p.color === 'skyblue') colorString = '135, 206, 235';

                ctx.fillStyle = `rgba(${colorString}, ${p.opacity})`;
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(p.text, p.x + 20, p.y);
            }
        }
    }

    function drawGameOver() {
        cancelAnimationFrame(animationId);
        bgm.pause(); // BGM停止

        ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        ctx.fillStyle = 'white';
        ctx.font = 'bold 40px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.fillText('Game Over', canvasWidth / 2, canvasHeight / 2 - 60);
        ctx.font = '30px Arial';
        ctx.fillText(`Final Score: ${score}`, canvasWidth / 2, canvasHeight / 2 - 10);

        // ランク判定
        let rank = 'C';
        if (score >= 1000) rank = 'S';
        else if (score >= 700) rank = 'A';
        else if (score >= 400) rank = 'B';

        ctx.font = '28px Arial';
        ctx.fillText(`Rank: ${rank}`, canvasWidth / 2, canvasHeight / 2 + 30);

        // ベストスコア更新
        if (score > bestScore) {
            bestScore = score;
            localStorage.setItem('bestScore', bestScore);
            ctx.font = '26px Arial';
            ctx.fillText('NEW RECORD! 🎉', canvasWidth / 2, canvasHeight / 2 + 70);
        }

        ctx.font = '20px Arial';
        ctx.fillText('Tap to Restart', canvasWidth / 2, canvasHeight / 2 + 110);
    }

    // --- 12. ゲームの初期化・リスタート ---

    function restartGame() {
        score = 0;
        combo = 0;
        comboTimer = 0;
        feverGauge = 0;
        isFever = false;
        feverTimer = 0;
        lastSpeedUpScore = 0;
        frameCount = 0;
        elements = [];
        popups = [];
        applyDifficultySettings();

        player.y = canvasHeight - groundHeight - playerSize;
        player.dy = 0;
        player.isJumping = false;
        player.extraJumpUsed = false;
        player.swingPhase = 0;
        player.rotation = 0;
        player.isInvincible = false;
        player.invincibleTimer = 0;

        // ロスト（ゲームオーバー）後はひよこでスタート
        baseEmoji = hasLostOnce ? '🐥' : '🏃';
        player.emoji = baseEmoji;

        isGameOver = false;
        isGameStarted = true;

        bgm.currentTime = 0;
        bgm.play().catch(e => console.log("BGM restart failed", e));
        gameLoop();
    }

    // --- 13. メインゲームループ ---

    function gameLoop() {
        if (isGameOver) {
            drawGameOver();
            return;
        }

        // コンボタイマー更新
        if (comboTimer > 0) {
            comboTimer--;
            if (comboTimer <= 0) {
                combo = 0;
                comboTimer = 0;
            }
        }

        // フィーバー更新
        if (isFever) {
            feverTimer--;
            feverGauge = Math.max(0, (feverTimer / FEVER_DURATION) * 100);

            if (feverTimer <= 0) {
                isFever = false;
                player.isInvincible = false;
                feverGauge = 0;
                player.emoji = baseEmoji; // 自転車→通常キャラに戻す
            }
        }

        // 背景
        drawBackground();

        // 地面・敵・プレイヤー・UI
        drawGround();
        spawnElements();
        updateAndDrawElements();
        updatePlayer();
        drawPlayer();
        checkCollisions();
        drawPopups();
        drawUI();

        // スコアに応じてゲームスピード上昇 (難易度アップ)
        if (!isFever && score >= lastSpeedUpScore + 200 && gameSpeed < 10) {
            gameSpeed = Math.min(10, gameSpeed + 0.2);
            lastSpeedUpScore = score;
        }

        animationId = requestAnimationFrame(gameLoop);
    }

    // --- 14. ゲーム開始 ---
    bgm.volume = 0.5;
    // BGMの再生自体はタップ時（unlockAudioContext側）で開始
    gameLoop(); // ゲームループ開始（描画だけ先に回しておく）
</script>
