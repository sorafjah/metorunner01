<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>無限横スクロール・ジャンプゲーム</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;          /* 画面の縦スクロールを防ぐ */
      background: #87ceeb;       /* 空の色 */
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      touch-action: none;        /* スクロールジェスチャをキャンセル */
      -webkit-user-select: none;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    // ==========================
    // 基本設定・グローバル変数
    // ==========================
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let player;
    let walls = [];
    let items = [];      // 通常アイテム＋モード切替アイテム
    let birds = [];
    let dogs = [];
    let holes = [];
    let platforms = [];  // 空中に乗れる床

    let score = 0;
    let gameOver = false;
    let isTouching = false;

    let lastTime = 0;

    const BASE_SCROLL_SPEED = 240;  // 基本スクロール速度（px/sec）
    const GRAVITY = 900;            // 重力加速度（px/sec^2）
    const GROUND_RATIO = 0.8;       // 地面の高さ（画面高さに対する比率）

    let spawnTimer = 0;
    let nextSpawnTime = 1.0;        // 次にオブジェクトを生成するまでの時間（秒）

    // --- モード管理 ---
    let isChickMode = false;
    let chickTimer = 0;
    const CHICK_MODE_DURATION = 4.0;       // ひよこモード継続時間（秒）

    let isBikeMode = false;
    let bikeTimer = 0;
    const BIKE_MODE_DURATION = CHICK_MODE_DURATION * 3; // 自転車モードは3倍の長さ

    // --- サウンド（Web Audio） ---
    let audioCtx = null;

    // AudioContext を初期化
    function initAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          audioCtx = new AC();
        }
      }
    }

    // AudioContext を再開（iOS用）
    function resumeAudio() {
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    // 短いビープ音を鳴らす
    function playBeep(frequency, duration, type = "sine") {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = frequency;
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.3, now + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

      osc.start(now);
      osc.stop(now + duration + 0.05);
    }

    function playItemSound() {
      // 通常アイテム用：高めのピッ
      playBeep(880, 0.15);
    }

    function playChickSound() {
      // ひよこモード用：ピッ → さらに高いピッ
      playBeep(660, 0.10);
      setTimeout(() => playBeep(990, 0.12), 120);
    }

    function playBikeSound() {
      // 自転車モード用：低め → 中くらい
      playBeep(440, 0.10);
      setTimeout(() => playBeep(660, 0.12), 120);
    }

    function playHitSound() {
      // ゲームオーバー用：低めのブー
      playBeep(220, 0.40, "square");
    }

    // ==========================
    // 画面サイズ・地面の高さ
    // ==========================
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function getGroundY() {
      return canvas.height * GROUND_RATIO;
    }

    // ==========================
    // ゲーム初期化・リスタート
    // ==========================
    function resetGame() {
      const groundY = getGroundY();

      // プレイヤーの初期位置（画面左側）
      player = {
        x: canvas.width * 0.15,
        y: groundY - 40,
        width: 40,
        height: 40,
        vy: 0,
        emoji: "🧍"
      };

      // 各オブジェクトの配列をリセット
      walls = [];
      items = [];
      birds = [];
      dogs = [];
      holes = [];
      platforms = [];

      score = 0;
      gameOver = false;
      spawnTimer = 0;
      nextSpawnTime = randomRange(0.8, 1.6);

      // モード解除
      isChickMode = false;
      chickTimer = 0;
      isBikeMode = false;
      bikeTimer = 0;
    }

    // ==========================
    // ユーティリティ関数
    // ==========================
    function randomRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    // 矩形同士の当たり判定
    function rectsOverlap(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    // プレイヤーが穴の真上（地面の範囲）にいるかどうか
    function isPlayerOverHole(p) {
      const pxCenter = p.x + p.width / 2;
      for (const hole of holes) {
        if (pxCenter > hole.x && pxCenter < hole.x + hole.width) {
          return true;
        }
      }
      return false;
    }

    // ==========================
    // モード切り替え
    // ==========================
    function activateChickMode() {
      isChickMode = true;
      chickTimer = CHICK_MODE_DURATION;
      // 自転車モード中だったら終了
      if (isBikeMode) {
        isBikeMode = false;
        bikeTimer = 0;
      }
      player.emoji = "🐥";
      playChickSound();
    }

    function activateBikeMode() {
      isBikeMode = true;
      bikeTimer = BIKE_MODE_DURATION;
      // ひよこモード中だったら終了
      if (isChickMode) {
        isChickMode = false;
        chickTimer = 0;
      }
      player.emoji = "🚴";
      playBikeSound();
    }

    function updateModeTimers(dt) {
      if (isChickMode) {
        chickTimer -= dt;
        if (chickTimer <= 0) {
          isChickMode = false;
          chickTimer = 0;
          // ほかのモードがなければ人間に戻す
          if (!isBikeMode) {
            player.emoji = "🧍";
          }
        }
      }

      if (isBikeMode) {
        bikeTimer -= dt;
        if (bikeTimer <= 0) {
          isBikeMode = false;
          bikeTimer = 0;
          if (!isChickMode) {
            player.emoji = "🧍";
          }
        }
      }
    }

    function getCurrentScrollSpeed() {
      let speed = BASE_SCROLL_SPEED;
      if (isChickMode) {
        speed = BASE_SCROLL_SPEED * 0.6;   // ひよこモード中はゆっくり
      }
      if (isBikeMode) {
        speed = BASE_SCROLL_SPEED * 1.3;   // 自転車モード中はちょっと速く
      }
      return speed;
    }

    // ==========================
    // オブジェクト生成
    // ==========================
    function spawnObject() {
      const groundY = getGroundY();
      const x = canvas.width + 40; // 画面右端の少し外から出現

      const r = Math.random();

      if (r < 0.25) {
        // 通常アイテム（食べ物）
        const foodEmojis = ["🍎", "🍌", "🍕", "🍩", "🍔", "🍇"];
        items.push({
          type: "score",
          x: x,
          y: randomRange(groundY * 0.3, groundY - 120),
          width: 28,
          height: 28,
          emoji: foodEmojis[Math.floor(Math.random() * foodEmojis.length)]
        });
      } else if (r < 0.35) {
        // ひよこモードアイテム
        items.push({
          type: "chick",
          x: x,
          y: randomRange(groundY * 0.3, groundY - 140),
          width: 30,
          height: 30,
          emoji: "🐣"
        });
      } else if (r < 0.45) {
        // 自転車モードアイテム
        items.push({
          type: "bike",
          x: x,
          y: randomRange(groundY * 0.3, groundY - 140),
          width: 34,
          height: 34,
          emoji: "🚲"
        });
      } else if (r < 0.6) {
        // 壁（箱）
        const wallHeight = 60;
        walls.push({
          x: x,
          y: groundY - wallHeight,
          width: 40,
          height: wallHeight
        });
      } else if (r < 0.7) {
        // 犬（地面の敵）
        const dogHeight = 32;
        dogs.push({
          x: x,
          y: groundY - dogHeight,
          width: 40,
          height: dogHeight,
          emoji: "🐶"
        });
      } else if (r < 0.8) {
        // 鳥（空中の敵）
        const birdHeight = 32;
        birds.push({
          x: x,
          y: randomRange(80, groundY - 130),
          width: 40,
          height: birdHeight,
          emoji: "🐦"
        });
      } else if (r < 0.9) {
        // 穴（地面が途切れる）
        const holeWidth = randomRange(100, 180);
        holes.push({
          x: x,
          width: holeWidth
        });
      } else {
        // 空中に乗れる床（プラットフォーム）
        const platWidth = randomRange(100, 160);
        const platY = randomRange(groundY * 0.4, groundY * 0.7);
        platforms.push({
          x: x,
          y: platY,
          width: platWidth,
          height: 20
        });
      }
    }

    // ==========================
    // 入力（タップ・クリック）処理
    // ==========================
    function handleTouchStart(e) {
      e.preventDefault();

      // サウンド初期化／再開
      if (!audioCtx) {
        initAudio();
      } else {
        resumeAudio();
      }

      if (gameOver) {
        resetGame();
      }
      isTouching = true;
    }

    function handleTouchEnd(e) {
      e.preventDefault();
      isTouching = false;
    }

    function setupInput() {
      // タッチ操作
      canvas.addEventListener("touchstart", handleTouchStart, { passive: false });
      canvas.addEventListener("touchend", handleTouchEnd, { passive: false });

      // iOSでのスクロール防止
      document.addEventListener("touchmove", function (e) {
        e.preventDefault();
      }, { passive: false });

      // マウス操作（PCテスト用）
      canvas.addEventListener("mousedown", (e) => {
        e.preventDefault();
        if (!audioCtx) {
          initAudio();
        } else {
          resumeAudio();
        }
        if (gameOver) {
          resetGame();
        }
        isTouching = true;
      });
      canvas.addEventListener("mouseup", (e) => {
        e.preventDefault();
        isTouching = false;
      });
      canvas.addEventListener("mouseleave", () => {
        isTouching = false;
      });
    }

    // ==========================
    // ゲーム更新処理
    // ==========================
    function update(dt) {
      if (gameOver) return;

      const groundY = getGroundY();

      // モードの残り時間を更新
      updateModeTimers(dt);

      // スクロール速度（モードで変化）
      const scrollSpeed = getCurrentScrollSpeed();
      const scroll = scrollSpeed * dt;

      // --- プレイヤーの更新 ---
      if (isTouching) {
        // タップしている間は上向きの一定速度
        player.vy = -300;
      } else {
        // タップしていない間は重力で落下
        player.vy += GRAVITY * dt;
      }
      player.y += player.vy * dt;

      // 画面上端の制限
      if (player.y < 20) {
        player.y = 20;
        if (player.vy < 0) player.vy = 0;
      }

      let playerBottom = player.y + player.height;

      // --- プラットフォーム（空中床）との当たり（上から落ちてきた場合のみ着地） ---
      let onPlatform = false;
      for (const plat of platforms) {
        if (
          player.vy >= 0 &&                 // 下向きに動いている
          playerBottom >= plat.y &&         // プレイヤーの下が床より下
          playerBottom <= plat.y + plat.height && // めり込みすぎていない
          player.x + player.width > plat.x &&
          player.x < plat.x + plat.width
        ) {
          player.y = plat.y - player.height;
          player.vy = 0;
          playerBottom = player.y + player.height;
          onPlatform = true;
          break;
        }
      }

      // --- 地面・穴の処理 ---
      if (!onPlatform && player.vy >= 0 && playerBottom >= groundY) {
        if (isPlayerOverHole(player)) {
          // 穴に落ちた
          endGame();
        } else {
          // 通常の地面で止まる
          player.y = groundY - player.height;
          player.vy = 0;
          playerBottom = player.y + player.height;
        }
      }

      // 画面下まで落ちた場合もゲームオーバー（穴に落ちた延長など）
      if (player.y > canvas.height) {
        endGame();
      }

      // --- 背景オブジェクト（障害物・アイテムなど）の移動 ---
      function moveAndFilter(list) {
        return list
          .map(obj => {
            obj.x -= scroll;
            return obj;
          })
          .filter(obj => obj.x + (obj.width || 0) > -50);
      }

      walls = moveAndFilter(walls);
      items = moveAndFilter(items);
      birds = moveAndFilter(birds);
      dogs = moveAndFilter(dogs);
      platforms = moveAndFilter(platforms);

      // 穴は幅だけ持っているので別処理
      holes = holes
        .map(hole => {
          hole.x -= scroll;
          return hole;
        })
        .filter(hole => hole.x + hole.width > -50);

      // --- 当たり判定 ---
      const playerRect = {
        x: player.x,
        y: player.y,
        width: player.width,
        height: player.height
      };

      // 壁との衝突
      for (const wall of walls) {
        if (rectsOverlap(playerRect, wall)) {
          endGame();
          break;
        }
      }

      // 犬との衝突
      if (!gameOver) {
        for (const dog of dogs) {
          if (rectsOverlap(playerRect, dog)) {
            endGame();
            break;
          }
        }
      }

      // 鳥との衝突
      if (!gameOver) {
        for (const bird of birds) {
          if (rectsOverlap(playerRect, bird)) {
            endGame();
            break;
          }
        }
      }

      // アイテム取得
      if (!gameOver) {
        items = items.filter(item => {
          if (rectsOverlap(playerRect, item)) {
            if (item.type === "score") {
              score += 10;
              playItemSound();
            } else if (item.type === "chick") {
              activateChickMode();
            } else if (item.type === "bike") {
              activateBikeMode();
            }
            return false; // 消滅
          }
          return true;
        });
      }

      // --- スコア（時間経過） ---
      if (!gameOver) {
        score += dt * 5; // 生存時間に応じてスコア加算
      }

      // --- オブジェクト生成 ---
      spawnTimer += dt;
      if (spawnTimer >= nextSpawnTime) {
        spawnObject();
        spawnTimer = 0;
        nextSpawnTime = randomRange(0.8, 1.6);
      }
    }

    // ==========================
    // ゲームオーバー処理
    // ==========================
    function endGame() {
      if (!gameOver) {
        gameOver = true;
        playHitSound();
      }
    }

    // ==========================
    // 描画処理
    // ==========================
    function draw() {
      const groundY = getGroundY();

      // 背景（空）
      ctx.fillStyle = "#87ceeb";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // 地面（まず全面に描画）
      ctx.fillStyle = "#3c7c1b";
      ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

      // 穴（地面の一部を空の色で塗りつぶして消す）
      ctx.fillStyle = "#87ceeb";
      for (const hole of holes) {
        ctx.fillRect(hole.x, groundY, hole.width, canvas.height - groundY);
      }

      // 空中に乗れる床（プラットフォーム）
      ctx.fillStyle = "#cccccc";
      for (const plat of platforms) {
        ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
      }

      // プレイヤーの描画（絵文字）
      ctx.font = "32px system-ui";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(player.emoji, player.x + player.width / 2, player.y + player.height / 2);

      // 壁（箱）の描画
      ctx.fillStyle = "#8b4513";
      for (const wall of walls) {
        ctx.fillRect(wall.x, wall.y, wall.width, wall.height);
      }

      // 犬の描画
      ctx.font = "28px system-ui";
      for (const dog of dogs) {
        ctx.fillText(dog.emoji, dog.x + dog.width / 2, dog.y + dog.height / 2);
      }

      // 鳥の描画
      for (const bird of birds) {
        ctx.fillText(bird.emoji, bird.x + bird.width / 2, bird.y + bird.height / 2);
      }

      // アイテム（食べ物＋モードアイテム）の描画
      for (const item of items) {
        ctx.fillText(item.emoji, item.x + item.width / 2, item.y + item.height / 2);
      }

      // スコア表示（右上）
      ctx.fillStyle = "#000000";
      ctx.font = "20px system-ui";
      ctx.textAlign = "right";
      ctx.textBaseline = "top";
      ctx.fillText("Score: " + Math.floor(score), canvas.width - 16, 10);

      // ゲームオーバー表示
      if (gameOver) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.font = "36px system-ui";
        ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 20);

        ctx.font = "24px system-ui";
        ctx.fillText("Score: " + Math.floor(score), canvas.width / 2, canvas.height / 2 + 20);

        ctx.font = "18px system-ui";
        ctx.fillText("画面をタップしてリスタート", canvas.width / 2, canvas.height / 2 + 60);
      }
    }

    // ==========================
    // メインループ
    // ==========================
    function gameLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      update(dt);
      draw();

      requestAnimationFrame(gameLoop);
    }

    // ==========================
    // 初期化
    // ==========================
    function init() {
      resizeCanvas();
      resetGame();
      setupInput();
      requestAnimationFrame(gameLoop);
    }

    window.addEventListener("resize", () => {
      resizeCanvas();
      resetGame(); // 画面サイズ変更時はリセット
    });

    init();
  </script>
</body>
</html>
